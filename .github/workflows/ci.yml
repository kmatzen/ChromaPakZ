name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-python:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libvpx + tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev pkg-config cmake ninja-build ffmpeg

      - name: Install libvpx + tools (macOS)
        if: runner.os == 'macOS'
        run: brew install libvpx pkg-config cmake ninja ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately before any build: the package must import, and its pure-Python helpers must
      # work, with no compiled _core on disk (the native load is lazy). These two are named
      # explicitly because that *ordering* is the point, not because the list is a coverage
      # inventory — the full suite below is glob-discovered.
      - name: Pure-Python checks (no compiled core)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest coverage
          python -m pytest tests/test_lazy_native.py tests/test_webm_inspect.py

      - name: CMake build + C++ self-test (bit-exact)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/dccli selftest

      - name: C++ side of the cross-language quantizer golden vectors
        run: ./build/dccli goldencheck tests/fixtures/quant_golden.csv

      # The whole tests/ directory runs via pytest discovery — no list to keep in sync here.
      # ffmpeg is installed above, so tests/test_ffmpeg_interop.py runs rather than skipping.
      - name: pip install (compiles via CMake) + Python suite, with coverage
        run: |
          python -m pip install . --no-build-isolation || python -m pip install .
          coverage run -m pytest tests
          coverage report
          chromapakz-ingest --help > /dev/null   # console script is wired up and importable

  native-coverage:
    name: native coverage (gcov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libvpx + tools
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev pkg-config cmake ninja-build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install gcovr

      # Instrumented build lives in its own directory so nothing shipped is ever built --coverage.
      - name: Build instrumented and exercise the core
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DCHROMAPAKZ_COVERAGE=ON
          cmake --build build-cov -j
          ./build-cov/dccli selftest
          ./build-cov/dccli goldencheck tests/fixtures/quant_golden.csv

      # Reported, not gated: the point is that untested error paths in the C++ core stop being
      # invisible. Add a --fail-under-line once the number has settled.
      - name: Coverage report
        run: gcovr --root . --filter native/ --txt --print-summary

  browser:
    name: in-browser VP9 lossless (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libvpx
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev pkg-config cmake ninja-build
      - uses: actions/setup-node@v4
        with:
          # >=22 for the test runner's built-in glob, which is what makes discovery automatic.
          node-version: "22"
      - name: Run the headless WebCodecs probe (asserts bit-exact encode->decode)
        working-directory: experiments/webcodecs-lossless
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright
          npx playwright install --with-deps chromium
          # Full Node suite (glob-discovered, incl. the WASM fallback round-trips) with coverage.
          (cd ../.. && npm run test:coverage)
          BROWSER=chromium node run.mjs single 256 | tee out.txt
          grep -q "EXACT" out.txt
          BROWSER=chromium node run.mjs streaming 256 12 | tee stream.txt
          grep -q "YES ✓" stream.txt
          BROWSER=chromium node run.mjs network 256 8 | tee network.txt
          grep -q "YES ✓" network.txt
          BROWSER=chromium node run.mjs multisignal 128 6 | tee multi.txt
          grep -q "YES ✓" multi.txt
          node smoke-demo.mjs | tee demo.txt
          grep -q "bit-exact" demo.txt

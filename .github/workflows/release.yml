name: release

# Cut a GitHub Release (tag like v0.1.0) to build wheels + sdist and publish to PyPI
# via Trusted Publishing (OIDC — no API token stored). See docs/RELEASING.md for one-time setup.
on:
  release:
    types: [published]
  workflow_dispatch: {}        # manual runs build artifacts without publishing

jobs:
  # Tagging v0.3.0 while the package still says 0.2.0 would publish the wrong version to PyPI
  # under a name nothing else agrees with, with no way to take it back. Check first, build after.
  # `npm test` already runs this file on every PR; it runs again here because a tag is pushed
  # independently of the commit it points at, so only the release itself can check the tag.
  version-guard:
    name: tag matches the declared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: package.json and the Python package agree on the version
        run: node --test tests/js_version_consistency.test.mjs
      - name: ...and match the release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$declared" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match the declared version $declared"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $declared"

      # The tag freezes the tree, and the sdist carries CHANGELOG.md into PyPI permanently — so a
      # section still headed "unreleased" cannot be corrected after the fact, only apologised for.
      # 0.3.0 shipped exactly that way. Checked only on a release: on a PR the upcoming section is
      # *supposed* to say unreleased, which is why this cannot live in the test suite.
      - name: The changelog has a dated section for this version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          heading="$(grep -m1 -E "^## +${tag//./\\.}( |$)" CHANGELOG.md || true)"
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## $tag' section — add one before tagging"
            exit 1
          fi
          case "$(printf '%s' "$heading" | tr '[:upper:]' '[:lower:]')" in
            *unreleased*|*tbd*|*todo*)
              echo "::error::CHANGELOG.md still marks $tag unreleased: $heading"
              echo "::error::Stamp the date and re-tag — the sdist ships this file to PyPI for good."
              exit 1 ;;
          esac
          if ! printf '%s' "$heading" | grep -qE '[0-9]{4}-[0-9]{2}-[0-9]{2}'; then
            echo "::error::CHANGELOG.md section for $tag carries no YYYY-MM-DD date: $heading"
            exit 1
          fi
          echo "changelog: $heading"

  wheels:
    name: wheels (${{ matrix.os }})
    needs: [version-guard]
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is a native arm64 runner — manylinux aarch64 wheels without QEMU
        # emulation (which would make the from-source libvpx build take hours).
        #
        # macOS is arm64 only, and not by choice: macos-13 was the last Intel image and GitHub
        # retired it in December 2025. The label still resolves, so a job requesting it queues
        # forever rather than failing — which is how this was found. Building x86_64 would now
        # mean cross-compiling from the arm64 runner, including libvpx (install-libvpx.sh
        # configures for `uname -m`), and cibuildwheel cannot run its test-command against a
        # wheel it cross-built. Intel macOS falls back to a source build from the sdist.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1
        # libvpx provisioning + test command come from [tool.cibuildwheel] in pyproject.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    needs: [version-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      # A file missing from the sdist used to surface only for whoever pip-installed it.
      - name: Install the sdist in a clean environment and import it
        run: |
          sudo apt-get update && sudo apt-get install -y libvpx-dev pkg-config cmake ninja-build
          python -m venv /tmp/sdistenv
          /tmp/sdistenv/bin/pip install --upgrade pip
          /tmp/sdistenv/bin/pip install numpy
          /tmp/sdistenv/bin/pip install dist/*.tar.gz
          cd /tmp && /tmp/sdistenv/bin/python -c "import chromapakz; from chromapakz import ingest, webm_inspect; print(chromapakz.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Last, deliberately. Publishing is the only step here that cannot be undone or retried: PyPI
  # refuses to re-upload a version forever, and npm's unpublish window is 72 hours after which the
  # version number is burned. So the order is everything-that-can-fail-cheaply, then the registry
  # that has never been published to (npm), then the one that has (PyPI carried 0.2.0 through this
  # same job). Independent publish jobs would mean an npm token or provenance fault — in a code path
  # no dry-run can exercise, since workflow_dispatch skips both — landing *after* PyPI was already
  # permanent.
  publish:
    name: publish to PyPI
    needs: [wheels, sdist, publish-npm]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi                 # configure a GitHub Environment named "pypi"
    permissions:
      id-token: write                 # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token: PyPI Trusted Publishing authenticates via the OIDC token above.

  # The browser library is the other half of a release: src/ *is* the shipped artifact (no build
  # step — package.json points `exports` straight at it), and the committed vp9-*.wasm ride along.
  # Nothing else validates it at tag time: ci.yml runs on pushes to main and on PRs, and a tag
  # matches neither, so the suite runs here before anything reaches the registry.
  #
  # Gated on the wheels even though it needs none of them: a Python build that fails after npm has
  # published would leave a version on one registry that can never exist on the other.
  publish-npm:
    name: publish to npm
    needs: [wheels, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm                  # configure a GitHub Environment named "npm"
    permissions:
      contents: read
      id-token: write                 # provenance attestation (links the tarball to this workflow)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Node suite
        run: npm test
      - name: The tarball carries what it claims
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const f = require("./pack.json")[0].files.map(x => x.path);
            // The WASM codecs are committed binaries, not build outputs — a `files` entry that
            // stopped matching them would ship a package that cannot decode on Firefox/Safari.
            const need = ["src/chromapakz.js", "src/webm.js", "src/signals.js",
                          "src/backend/wasm/vp9-decode.wasm", "src/backend/wasm/vp9-encode.wasm",
                          "README.md", "LICENSE"];
            const missing = need.filter(n => !f.includes(n));
            if (missing.length) { console.error("missing from npm tarball:", missing); process.exit(1); }
            console.log("npm tarball carries " + f.length + " files, all required entries present");
          '
      - name: npm publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

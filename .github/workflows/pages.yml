name: pages

# Publishes the in-browser demo to GitHub Pages so it has a shareable live URL.
# The demo is static (demo/index.html imports ../src/*.js with relative paths), so
# serving the repo root works directly: the demo lands at
#   https://<owner>.github.io/<repo>/demo/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stage only what the demo actually loads. Publishing the repo root put every file in the
      # repository — tests, fixtures, experiment scratch — on a public URL to serve one page.
      - name: Stage the demo
        run: |
          mkdir -p _site/demo _site/docs
          cp -r src _site/src
          cp -r demo/. _site/demo/
          cp README.md LICENSE _site/
          cp docs/API.md docs/FORMAT.md _site/docs/ 2>/dev/null || true
          printf '<meta http-equiv="refresh" content="0; url=./demo/">\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
